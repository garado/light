[project]
name = "light_api"
version = "0.1.0"
description = "Unofficial Python API for the Light Phone"
authors = [{ name = "Alexis Garado", email = "alexisgarado@proton.me" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keyring",
    "mutagen",
    "light_client",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["light_api"]
