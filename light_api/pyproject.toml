[project]
name = "light-phone-api"
version = "0.4.0"
description = "Unofficial Python API for the Light Phone"
authors = [{ name = "Alexis Garado", email = "alexisgarado@proton.me" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.23.0,<0.29.0",
    "attrs>=22.2.0",
    "python-dateutil>=2.8.0",
    "keyring",
    "mutagen",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["light_api", "open_api_specification_client"]
