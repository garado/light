[tool.uv.workspace]
members = ["light_api", "light_cli_tui"]

[tool.uv.sources]
light_api = { workspace = true }
light-phone-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "respx",
    "jsonschema",
]

[tool.pytest.ini_options]
testpaths = ["light_api/tests", "light_cli_tui/tests"]

[tool.coverage.run]
source = ["light_api/light_api", "light_cli_tui/light_cli_tui"]
omit = ["*/open_api_specification_client/*"]

[tool.coverage.report]
show_missing = true
