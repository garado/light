[tool.poetry]
name = "light_client"
version = "1.0.0"
description = "Auto-generated API client for the Light Phone cloud API"
authors = [
  "Alexis Garado <alexisgarado@proton.me>"
]
readme = "README.md"
packages = [
    { include = "open_api_specification_client" },
]
include = ["open_api_specification_client/py.typed"]

[tool.poetry.dependencies]
python = "^3.10"
httpx = ">=0.23.0,<0.29.0"
attrs = ">=22.2.0"
python-dateutil = "^2.8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
