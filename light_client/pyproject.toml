[project]
name = "light_client"
version = "1.0.0"
description = "Auto-generated API client for the Light Phone cloud API"
authors = [{ name = "Alexis Garado", email = "alexisgarado@proton.me" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.23.0,<0.29.0",
    "attrs>=22.2.0",
    "python-dateutil>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["open_api_specification_client"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
