[project]
name = "light-phone-daemon"
version = "0.6.0"
description = "Local gRPC daemon exposing the Light Phone API to other processes"
authors = [{ name = "Alexis Garado", email = "alexisgarado@proton.me" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "light-phone-api",
    "grpcio>=1.60",
]

[project.scripts]
light-daemon = "light_daemon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["light_daemon"]
